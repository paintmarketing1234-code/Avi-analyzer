name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # 1. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Checkout project
      - name: Checkout source
        uses: actions/checkout@v5

      # 4. Cache Buildozer files
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 5. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      # 6. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      # 7. Build APK
      - name: Build APK
        timeout-minutes: 360
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

        run: |
          buildozer android debug

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Analyzer-APK
          path: bin/*.apk
          if-no-files-found: error
